<script>

function halo() {
    document.getElementById("menu").style.display = "block";
}

function waktu(){
let d=new Date();
document.getElementById("jam").innerHTML=d.toLocaleTimeString();
}

setInterval(waktu,1000);
waktu();

const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const huruf="01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const font=18;
const kolom=canvas.width/font;
const hujan=[];

for(let i=0;i<kolom;i++) hujan[i]=1;

function gambar(){

ctx.fillStyle="rgba(0,0,0,0.08)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#00ff66";
ctx.font=font+"px monospace";

for(let i=0;i<hujan.length;i++){

let teks=huruf[Math.floor(Math.random()*huruf.length)];

ctx.fillText(teks,i*font,hujan[i]*font);

if(hujan[i]*font>canvas.height&&Math.random()>0.98)
hujan[i]=0;

hujan[i]++;

}

}

setInterval(gambar,35);

</script>
